version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: app_database
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: indicators_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend (FastAPI)
  api:
    build: 
      context: ./backend
    container_name: app_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/indicators_db
    ports:
      - "8080:8000"
    depends_on:
      - db

  angular-app:
    build:
      context: ./frontend-angular
    container_name: app_angular_entry
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - api

  # 4. Frontend React (Painel Gerencial)
  react-app:
    build:
      context: ./frontend-react
    container_name: app_react_dashboard
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: