<div class="container">
  <header>
    <h1>Registro de Entregas</h1>
    <p>Preencha os dados do funcionário para registrar a atividade diária.</p>
  </header>

  <!-- Mensagens de Feedback -->
  <div *ngIf="mensagem" class="alert" [ngClass]="{'alert-success': !erro, 'alert-error': erro}">
    {{ mensagem }}
  </div>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="employee_name">Nome do Funcionário *</label>
      <input type="text" id="employee_name" formControlName="employee_name" placeholder="Ex: João Silva">
      <span class="error" *ngIf="registroForm.get('employee_name')?.invalid && registroForm.get('employee_name')?.touched">
        Nome é obrigatório.
      </span>
    </div>

    <div class="form-group">
      <label for="department">Departamento *</label>
      <select id="department" formControlName="department">
        <option value="" disabled selected>Selecione um departamento</option>
        <option value="Vendas">Vendas</option>
        <option value="Logística">Logística</option>
        <option value="TI">TI</option>
        <option value="RH">RH</option>
      </select>
      <span class="error" *ngIf="registroForm.get('department')?.invalid && registroForm.get('department')?.touched">
        Departamento é obrigatório.
      </span>
    </div>

    <div class="form-group">
      <label for="reference_date">Data de Referência *</label>
      <input type="date" id="reference_date" formControlName="reference_date">
      <span class="error" *ngIf="registroForm.get('reference_date')?.invalid && registroForm.get('reference_date')?.touched">
        Data inválida.
      </span>
    </div>

    <div class="form-group">
      <label for="deliveries">Quantidade de Entregas *</label>
      <input type="number" id="deliveries" formControlName="deliveries" min="0">
      <span class="error" *ngIf="registroForm.get('deliveries')?.invalid && registroForm.get('deliveries')?.touched">
        Deve ser um número não negativo.
      </span>
    </div>

    <div class="form-group">
      <label for="note">Observação (Opcional)</label>
      <textarea id="note" formControlName="note" rows="3" placeholder="Detalhes adicionais..."></textarea>
    </div>

    <button type="submit" [disabled]="registroForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Salvando...' : 'Registrar Atividade' }}
    </button>

  </form>
</div>
