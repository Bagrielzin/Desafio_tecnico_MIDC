<div class="container">
  <header>
    <h1>Registro de Entregas</h1>
  </header>
  
  <div *ngIf="mensagem" class="alert" [ngClass]="{'alert-success': !erro, 'alert-error': erro}">
    {{ mensagem }}
  </div>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nome do Funcionário *</label>
      <input type="text" formControlName="employee_name">
    </div>
    <div class="form-group">
      <label>Departamento *</label>
      <select formControlName="department">
        <option value="" disabled>Selecione</option>
        <option value="Vendas">Vendas</option>
        <option value="Logística">Logística</option>
        <option value="TI">TI</option>
      </select>
    </div>
    <div class="form-group">
      <label>Data de Referência *</label>
      <input type="date" formControlName="reference_date">
    </div>
    <div class="form-group">
      <label>Quantidade de Entregas *</label>
      <input type="number" formControlName="deliveries" min="0">
    </div>
    <button type="submit" [disabled]="registroForm.invalid || isSubmitting">Registrar Atividade</button>
  </form>
</div>
